<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Wedding Image Browser</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        html,
        body {
            height: 100%;
        }

        #sidebar {
            height: 100vh;
            overflow-y: auto;
            border-right: 1px solid #ddd;
        }

        #preview {
            text-align: center;
        }

        #preview img {
            max-width: 100%;
            max-height: 600px;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 10px;
        }

        .gallery img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            cursor: pointer;
            border-radius: 6px;
            transition: .15s;
        }

        .gallery img:hover {
            transform: scale(1.03);
        }

        .image-number {
            cursor: pointer;
        }

        .image-number.active {
            background: #0d6efd;
            color: white;
        }
    </style>

</head>

<body>

    <div class="container-fluid">

        <div class="row">

            <!-- Sidebar -->

            <div class="col-2 p-0" id="sidebar">

                <div class="list-group rounded-0" id="imageList">
                </div>

            </div>

            <!-- Main -->

            <div class="col-10">

                <div class="p-3">

                    <div class="d-flex justify-content-between align-items-center mb-3">

                        <h3>S3 Image Browser</h3>

                        <div>

                            <label class="me-2">Images/Page</label>

                            <select id="pageSize" class="form-select d-inline w-auto">
                                <option>20</option>
                                <option selected>50</option>
                                <option>100</option>
                            </select>

                        </div>

                    </div>

                    <div id="preview" class="mb-4">

                        <h5 id="previewTitle">Select an Image</h5>

                        <img id="previewImage" src="" style="display:none;">

                    </div>

                    <div class="d-flex justify-content-between mb-3">

                        <button class="btn btn-primary" id="prevBtn">
                            Previous
                        </button>

                        <span id="pageInfo"></span>

                        <button class="btn btn-primary" id="nextBtn">
                            Next
                        </button>

                    </div>

                    <div class="gallery" id="gallery">

                    </div>

                </div>

            </div>

        </div>

    </div>

    <script>

        //============================
        // CONFIG
        //============================

        const BASE_URL = "https://f002.backblazeb2.com/file/Wedding-Photos-Chazaro-Haraksin22/Wedding-Photos/Pixel+That!+Photography+(";
        const THUMBNAIL_URL = "https://f002.backblazeb2.com/file/Wedding-Photos-Chazaro-Haraksin22/Wedding-Photos/thumbnails/";

        const MAX_IMAGE_ID = 1303;


        //============================

        let currentPage = 0;
        let pageSize = 50;

        //============================

        function imageUrl(id) {
            const paddedId = String(id).padStart(4, '0');
            return `${BASE_URL}${paddedId}+of+1303).jpg`;
        }

        function thumbnailUrl(id) {
            const padded = id.toString().padStart(4, '0');
            return `${THUMBNAIL_URL}${padded}.jpg`;
        }

        //============================

        function buildSidebar() {

            const list = document.getElementById("imageList");

            list.innerHTML = "";

            for (let i = 1; i <= MAX_IMAGE_ID; i++) {

                const a = document.createElement("a");

                a.className = "list-group-item list-group-item-action image-number";

                a.innerText = i;

                a.onclick = () => showPreview(i);

                list.appendChild(a);

            }

        }

        //============================

        function showPreview(id) {

            document.querySelectorAll(".image-number").forEach(x => x.classList.remove("active"));

            document.querySelectorAll(".image-number")[id - 1].classList.add("active");

            document.getElementById("previewTitle").innerHTML =
                `Image ${id}`;

            const img = document.getElementById("previewImage");

            img.style.display = "block";

            img.src = imageUrl(id);

        }

        //============================

        function buildGallery() {

            const gallery = document.getElementById("gallery");

            gallery.innerHTML = "";

            let start = currentPage * pageSize + 1;

            let end = Math.min(MAX_IMAGE_ID, start + pageSize - 1);

            document.getElementById("pageInfo").innerHTML =
                `${start} - ${end}`;

            for (let i = start; i <= end; i++) {

                const img = document.createElement("img");

                img.loading = "lazy";

                img.src = thumbnailUrl(i);

                img.title = i;

                img.onclick = () => showPreview(i);

                img.onerror = function () {

                    this.style.opacity = .2;

                }

                gallery.appendChild(img);

            }

        }

        //============================

        document.getElementById("pageSize").addEventListener("change", e => {

            pageSize = parseInt(e.target.value);

            currentPage = 0;

            buildGallery();

        });

        document.getElementById("prevBtn").onclick = () => {

            if (currentPage > 0) {

                currentPage--;

                buildGallery();

            }

        }

        document.getElementById("nextBtn").onclick = () => {

            if ((currentPage + 1) * pageSize < MAX_IMAGE_ID) {

                currentPage++;

                buildGallery();

            }

        }

        //============================

        buildSidebar();

        buildGallery();

    </script>

</body>

</html>
